<!DOCTYPE html>

<head>

<style>
    /* تنظیمات کلی صفحه */
body {
    background-color: #e9f6f8;
    font-family: Tahoma;
    direction: rtl;
    padding: 30px;
}

/* ظاهر فرم */
form {
    background-color: rgb(104, 139, 255);
    width: 450px;
    margin: auto;
    padding: 25px;
    border-radius: 12px;
    border: 2px solid #c5e1a5;
}

/* عنوان فرم */
h2 {
    color: #5210cc;
    text-align: center;
}

/* کادرهای ورودی */
input[type="text"],
textarea,
select {
    width: 90%;
    padding: 10px;
    margin: 8px 0;
    border: 1px solid #a5d6a7;
    border-radius: 6px;
}

/* وقتی داخل کادر کلیک می‌کنیم */
input:focus,
textarea:focus,
select:focus {
    outline: none;
    border: 2px solid #66bb6a;
}

/* دکمه‌ها */
button {
    background-color: #4caf50;
    color: white;
    padding: 10px 18px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

/* تغییر رنگ دکمه هنگام رفتن موس روی آن */
button:hover {
    background-color: #fbc02d;
    color: black;
}

/* رنگ عنوان‌ها */
label {
    color: #33691e;
}
</style>


</body>
</html>
